<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} · Altlast</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">Altlast</span>
      <span class="brand-sub">obsolescence register</span>
    </div>
    <div class="meta">
      {{ if .Scan.Host }}<span>{{ .Scan.Host }}</span>{{ end }}
      {{ if .ScanAge }}<span title="{{ .Scan.StartedAt }}">scanned {{ .ScanAge }}</span>{{ end }}
      <span class="version">{{ .Version }}</span>
    </div>
  </header>

  <main>
    {{ template "content" . }}
  </main>

  <footer>
    <span>Lifecycle data from endoflife.date</span>
    <span>Altlast never modifies anything it observes</span>
  </footer>
</body>
</html>
